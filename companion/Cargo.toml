[package]
name = "scarlet"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
base64 = "0.23"
chrono = "0.4"
flate2 = "1"
lexopt = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "=0.14.4"
scarlet-part = { git = "https://github.com/Medalink/scarlet-web", rev = "809a16d4c9857e7fde1123611d34d9c4ad22ec17", package = "scarlet-part" }
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
ed25519-dalek = { version = "=3.0.0", default-features = false }
getrandom = "=0.4.3"
sha2 = "=0.11.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
