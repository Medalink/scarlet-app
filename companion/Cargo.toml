[package]
name = "scarlet"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
base64 = "0.23"
chrono = "0.4"
flate2 = "1"
lexopt = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "=0.14.4"
scarlet-part = { git = "https://github.com/Medalink/scarlet-web", rev = "c474e5caab93db0e2a621030557c225a40059658", package = "scarlet-part" }
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
ed25519-dalek = { version = "=3.0.0", default-features = false }
getrandom = "=0.4.3"
sha2 = "=0.11.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
non_ascii_idents = "deny"
macro_use_extern_crate = "deny"
unused_import_braces = "deny"
meta_variable_misuse = "deny"
unused_macro_rules = "deny"
unit_bindings = "deny"
redundant_lifetimes = "deny"
unused_lifetimes = "deny"
explicit_outlives_requirements = "deny"
trivial_numeric_casts = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
wildcard_imports = "deny"
ref_option = "deny"
redundant_clone = "deny"
needless_for_each = "deny"
string_add = "deny"
missing_panics_doc = "deny"
undocumented_unsafe_blocks = "deny"
todo = "deny"
unimplemented = "deny"
allow_attributes_without_reason = "deny"
unchecked_time_subtraction = "deny"
mem_forget = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
try_err = "deny"
verbose_file_reads = "deny"
string_lit_chars_any = "deny"
float_cmp_const = "deny"
mutex_atomic = "deny"
empty_drop = "deny"
assertions_on_result_states = "deny"
unnecessary_safety_comment = "deny"
rest_pat_in_fully_bound_structs = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
fn_to_numeric_cast_any = "deny"
cfg_not_test = "deny"
suspicious_xor_used_as_pow = "deny"
inefficient_to_string = "deny"
cloned_instead_of_copied = "deny"
flat_map_option = "deny"
manual_string_new = "deny"
stable_sort_primitive = "deny"
needless_bitwise_bool = "deny"
iter_filter_is_some = "deny"
iter_filter_is_ok = "deny"
option_as_ref_cloned = "deny"
unnecessary_join = "deny"
unnecessary_box_returns = "deny"
linkedlist = "deny"
macro_use_imports = "deny"
manual_instant_elapsed = "deny"
manual_ok_or = "deny"
mut_mut = "deny"
naive_bytecount = "deny"
no_effect_underscore_binding = "deny"
ref_option_ref = "deny"
same_functions_in_if_condition = "deny"
string_add_assign = "deny"
transmute_ptr_to_ptr = "deny"
zero_sized_map_values = "deny"
mismatching_type_param_order = "deny"
index_refutable_slice = "deny"
inconsistent_struct_constructor = "deny"
invalid_upcast_comparisons = "deny"
copy_iterator = "deny"
expl_impl_clone_on_copy = "deny"
case_sensitive_file_extension_comparisons = "deny"
ptr_cast_constness = "deny"
fn_params_excessive_bools = "deny"
into_iter_without_iter = "deny"
pub_underscore_fields = "deny"
should_panic_without_expect = "deny"
unicode_not_nfc = "deny"
trait_duplication_in_bounds = "deny"
type_repetition_in_bounds = "deny"
path_buf_push_overwrite = "deny"
read_zero_byte_vec = "deny"
trivial_regex = "deny"
iter_with_drain = "deny"
debug_assert_with_mut_call = "deny"
string_lit_as_bytes = "deny"
set_contains_or_insert = "deny"
literal_string_with_formatting_args = "deny"
while_float = "deny"
fallible_impl_from = "deny"
iter_on_empty_collections = "deny"
non_send_fields_in_send_ty = "deny"
tuple_array_conversions = "deny"
empty_line_after_doc_comments = "deny"
as_ptr_cast_mut = "deny"
clear_with_drain = "deny"
coerce_container_to_any = "deny"
nonstandard_macro_braces = "deny"
significant_drop_in_scrutinee = "deny"
collection_is_never_read = "deny"
needless_collect = "deny"
create_dir = "deny"
filetype_is_file = "deny"
derive_partial_eq_without_eq = "deny"
large_stack_arrays = "deny"
unused_result_ok = "deny"
unused_peekable = "deny"
mixed_read_write_in_expression = "deny"
maybe_infinite_iter = "deny"
lossy_float_literal = "deny"
redundant_else = "deny"
unnecessary_self_imports = "deny"
unnecessary_struct_initialization = "deny"
manual_is_variant_and = "deny"
branches_sharing_code = "deny"
manual_assert = "deny"
