<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scarlet</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19c5 0 3.4-7 8-7s3.4-6.4 8-6.4" fill="none" stroke="#ff2d55" stroke-width="2.6" stroke-linecap="round"/><circle cx="19.6" cy="5.4" r="2.8" fill="#ff2d55"/></svg>
    <div class="title">Scarlet</div>
    <div class="ver" id="ver"></div>
    <button class="linkbtn" id="upd" hidden></button>
    <div class="spacer"></div>
    <div id="head-stats" class="head-stats"></div>
    <select id="char" title="Character" aria-label="Character"><option value="">All characters</option></select>
    <div class="winctl">
      <button id="win-min" type="button" aria-label="Minimize" title="Minimize"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5.5h10"/></svg></button>
      <button id="win-max" type="button" aria-label="Maximize" title="Maximize"><svg class="i-max" viewBox="0 0 10 10" aria-hidden="true"><path d="M.5.5h9v9h-9z"/></svg><svg class="i-restore" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 2.5V.5h7v7h-2M.5 2.5h7v7h-7z"/></svg></button>
      <button id="win-close" type="button" aria-label="Close" title="Close"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M.5.5l9 9M9.5.5l-9 9"/></svg></button>
    </div>
  </header>
  <div id="shell">
    <nav id="nav"></nav>
    <main>
      <div id="pagetitle"></div>
      <div id="body"></div>
    </main>
  </div>
  <script type="module" src="titlebar.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
